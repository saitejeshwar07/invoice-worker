<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CentrAlign - Autonomous AI Worker</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#262d36;--text:#e6edf3;--mut:#8b949e;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--acc:#58a6ff;--mono:ui-monospace,Consolas,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,Segoe UI,Arial,sans-serif}
header{padding:14px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
header b{font-size:16px}.pill{font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.wrap{display:grid;grid-template-columns:380px 1fr;gap:18px;padding:18px 24px;align-items:start}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
textarea{width:100%;min-height:76px;background:#0d1117;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;resize:vertical}
button{background:var(--acc);color:#04111f;border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:13px}
button.sec{background:transparent;color:var(--text);border:1px solid var(--line)}button.ok{background:var(--ok)}button.bad{background:var(--bad);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{background:#0d1117;border:1px solid var(--line);color:var(--mut);border-radius:99px;padding:4px 10px;font-size:12px;cursor:pointer}.chip:hover{color:var(--text)}
.tl>div{border-left:2px solid var(--line);padding:4px 0 6px 14px;margin-left:6px;position:relative}
.tl>div:before{content:"";position:absolute;left:-6px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--line)}
.tl .act:before{background:var(--acc)}.tl .bad:before{background:var(--bad)}.tl .ok:before{background:var(--ok)}.tl .warn:before{background:var(--warn)}
.mono{font-family:var(--mono);font-size:12.5px;word-break:break-word}.mut{color:var(--mut)}
.tag{display:inline-block;font-size:11px;border-radius:5px;padding:0 6px;margin-right:6px;font-weight:600}
.t-bad{background:#3d1517;color:var(--bad)}.t-ok{background:#12301b;color:var(--ok)}.t-warn{background:#3a2d0c;color:var(--warn)}.t-acc{background:#10294a;color:var(--acc)}
details summary{cursor:pointer;color:var(--mut);font-size:12px}pre{white-space:pre-wrap;margin:6px 0 0;background:#0d1117;border:1px solid var(--line);border-radius:6px;padding:8px;font:12px var(--mono);max-height:220px;overflow:auto}
.shot{max-width:300px;border:1px solid var(--line);border-radius:6px;margin-top:6px;display:block;cursor:zoom-in}
.approve{border-color:var(--warn);background:#221b08}.final.ok{border-color:var(--ok)}.final.bad{border-color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:12.5px;margin-top:6px}td,th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
input.txt{width:100%;background:#0d1117;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:8px}
ol{margin:4px 0 0 18px;padding:0}.hide{display:none}
</style></head><body>
<header><b>🤖 Autonomous AI Worker <span class="mut" style="font-weight:400">· CentrAlign prototype</span></b><span class="pill" id="prov">…</span></header>
<div class="wrap">
 <div>
  <div class="panel"><h3>Task</h3>
   <textarea id="task" placeholder="Describe what you want done…">Process the latest invoice from AWS.</textarea>
   <div class="row"><button id="run">Run task</button><button class="sec" id="reset">Reset environment</button></div>
   <div class="row" id="chips"></div>
   <p class="mut" style="font-size:12px;margin:10px 0 0">Mock company apps: <a id="l1" target="_blank" style="color:var(--acc)">Invoice Portal</a> · <a id="l2" target="_blank" style="color:var(--acc)">Finance System</a></p>
  </div>
  <div class="panel approve hide" id="human"><h3 style="color:var(--warn)" id="hkind">Human input needed</h3>
   <div id="hq"></div>
   <div id="hbtns" class="row"><button class="ok" id="approve">Approve</button><button class="bad" id="reject">Reject</button></div>
   <input class="txt" id="hans" placeholder="…or type a reply (for questions)"><div class="row"><button class="sec" id="send">Send reply</button></div>
  </div>
  <div class="panel hide" id="planp"><h3>Plan <span class="mut" id="planrev"></span></h3><div id="goal" class="mut"></div><ol id="plan"></ol></div>
  <div class="panel hide" id="memp"><h3>Working memory</h3><div id="mem" class="row" style="margin:0"></div></div>
  <div class="panel final hide" id="finalp"><h3>Result</h3><div id="final"></div></div>
 </div>
 <div class="panel"><h3>Agent activity <span class="mut" id="status"></span></h3><div class="tl" id="tl"><div class="mut">Idle. Enter a task and press Run.</div></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const EXAMPLES=["Process the latest invoice from AWS.","Process the latest invoice from Google Cloud.","Process the latest invoice from Microsoft.","Process the latest invoice."];
let runId=null,next=0,adapting=false,busy=false;
EXAMPLES.forEach(t=>{const c=document.createElement("span");c.className="chip";c.textContent=t.replace("Process the latest invoice ","");c.title=t;c.onclick=()=>$("task").value=t;$("chips").appendChild(c)});
fetch("/api/config").then(r=>r.json()).then(c=>{$("prov").textContent=c.provider?("LLM: "+c.provider):"⚠ no LLM key in .env";$("l1").href=c.portal;$("l2").href=c.finance});
function clearUI(){$("tl").innerHTML="";["planp","memp","finalp","human"].forEach(i=>$(i).classList.add("hide"));$("mem").innerHTML="";next=0;adapting=false}
function add(cls,html){const d=document.createElement("div");d.className=cls;d.innerHTML=html;$("tl").appendChild(d);d.scrollIntoView({block:"nearest"})}
function render(e){
 switch(e.type){
 case"start":add("act",`<span class="tag t-acc">TASK</span>${esc(e.task)} <span class="mut">(${esc(e.provider)}/${esc(e.model)})</span>`);break;
 case"plan":$("planp").classList.remove("hide");$("goal").textContent=e.goal||$("goal").textContent;$("plan").innerHTML=e.plan.map(s=>`<li>${esc(s)}</li>`).join("");
  $("planrev").textContent=e.revision?"(revised)":"";
  add(e.revision?"warn":"act",`<span class="tag t-${e.revision?"warn":"acc"}">${e.revision?"RE-PLAN":"PLAN"}</span>${e.revision?esc(e.reason||""):esc(e.goal)}`+(e.missing_info&&e.missing_info.length?`<div class="mut">Missing info flagged: ${esc(e.missing_info.join("; "))}</div>`:""));break;
 case"thought":add("",`<span class="tag ${adapting?"t-warn":"t-acc"}">${adapting?"↻ ADAPT":"THINK"}</span><span class="mut">#${e.step}</span> ${esc(e.text)}`);adapting=false;break;
 case"action":add("act",`<span class="tag t-acc">ACT</span><span class="mono">${esc(e.tool)}(${esc(JSON.stringify(e.args)).slice(0,260)})</span>`);break;
 case"observation":add("",`<details><summary>Observation · ${esc(e.tool)}</summary><pre>${esc(e.text)}</pre></details>`);break;
 case"http_error":add("bad",`<span class="tag t-bad">HTTP ${e.status}</span>${esc(e.error)}`);adapting=true;break;
 case"failure":add("bad",`<span class="tag t-bad">FAILED</span><span class="mono">${esc(e.tool)}</span> ${esc(e.error)}`);adapting=true;break;
 case"blocked":add("bad",`<span class="tag t-bad">BLOCKED</span>${esc(e.error)}`);break;
 case"memory":$("memp").classList.remove("hide");$("mem").innerHTML=Object.entries(e.memory).map(([k,v])=>`<span class="chip" style="cursor:default">${esc(k)} = <b style="color:var(--text)">${esc(v)}</b></span>`).join("");break;
 case"screenshot":add("",`<a href="${e.url}" target="_blank"><img class="shot" src="${e.url}" loading="lazy" title="${esc(e.page_url)}"></a>`);break;
 case"approval_request":case"question":add("warn",`<span class="tag t-warn">${e.type==="approval_request"?"APPROVAL":"QUESTION"}</span>${esc(e.question)}`);break;
 case"human_response":add("ok",`<span class="tag t-ok">HUMAN</span>${esc(e.answer)}`);break;
 case"policy":add(e.approved?"ok":"bad",`<span class="tag ${e.approved?"t-ok":"t-bad"}">POLICY</span>${esc(e.note)}`);break;
 case"verification_start":add("warn",`<span class="tag t-warn">VERIFY</span>Independent verifier is checking the destination system…`);break;
 case"verify_action":add("",`<span class="mut">verifier ▸ ${esc(e.tool)} ${esc(JSON.stringify(e.args)).slice(0,160)}</span>`);break;
 case"verification":{const rows=(e.checks||[]).map(c=>`<tr><td>${esc(c.field)}</td><td>${esc(c.expected)}</td><td>${esc(c.actual)}</td><td>${c.match?"✅":"❌"}</td></tr>`).join("");
  add(e.verified?"ok":"bad",`<span class="tag ${e.verified?"t-ok":"t-bad"}">${e.verified?"VERIFIED":"NOT VERIFIED"}</span>${esc(e.summary)}${rows?`<table><tr><th>Field</th><th>Expected (source)</th><th>Actual (system)</th><th></th></tr>${rows}</table>`:""}`);if(!e.verified)adapting=true;break}
 case"final":{const ok=e.status==="success";$("finalp").classList.remove("hide");$("finalp").className="panel final "+(ok?"ok":"bad");
  $("final").innerHTML=`<div style="font-size:16px;font-weight:700">${ok?"✅ Task completed":(e.status==="blocked"?"⛔ Blocked":"❌ Task failed")}${e.verified?' · <span style="color:var(--ok)">verified</span>':""}</div><p>${esc(e.summary)}</p>`+
   ((e.evidence||[]).length?`<h3>Evidence</h3><ul>${e.evidence.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"");
  add(ok?"ok":"bad",`<span class="tag ${ok?"t-ok":"t-bad"}">DONE</span>${esc(e.status)}`);break}
 }}
async function poll(){
 try{const r=await (await fetch("/api/events?after="+next)).json();
  if(r.run_id!==runId){runId=r.run_id;clearUI();if(!r.run_id){setTimeout(poll,800);return}
    const r2=await (await fetch("/api/events?after=0")).json();r.events=r2.events;r.pending=r2.pending;r.status=r2.status}
  r.events.forEach(e=>{render(e);next=e.id+1});
  busy=r.status==="running";$("run").disabled=busy;$("status").textContent=r.status==="running"?"· running…":"";
  const h=$("human");if(r.pending){h.classList.remove("hide");$("hq").textContent=r.pending.question;const ap=r.pending.kind==="approval";
   $("hkind").textContent=ap?"Approval required":"The agent needs your input";$("hbtns").classList.toggle("hide",!ap)}else h.classList.add("hide");
 }catch(e){}
 setTimeout(poll,600)}
$("run").onclick=async()=>{const t=$("task").value.trim();if(!t)return;const r=await fetch("/api/run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({task:t})});if(!r.ok)alert((await r.json()).error)};
$("reset").onclick=async()=>{await fetch("/api/reset",{method:"POST"});add("",`<span class="tag t-ok">ENV</span>Finance database reset to seed data.`)};
const send=a=>fetch("/api/respond",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({answer:a})});
$("approve").onclick=()=>send("APPROVED");$("reject").onclick=()=>send("REJECTED");
$("send").onclick=()=>{const v=$("hans").value.trim();if(v){send(v);$("hans").value=""}};
poll();
</script></body></html>
